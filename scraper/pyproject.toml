[project]
name = "omscs-ratings-scraper"
version = "0.1.0"
description = "Scrapers for OMSHub and OMSCentral course review aggregates."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "pydantic>=2.7",
    "typer>=0.12",
    "structlog>=24.1",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13" 
]

# Expose our CLI as a real command
[project.scripts]
scrape-omscentral = "scraper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scraper"]

[tool.ruff]
line-length = 100
target-version = "py311"
