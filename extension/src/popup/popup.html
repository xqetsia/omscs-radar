<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Georgia Tech OMSCS Radar — Settings</title>
  <style>
    :root {
      --gt-gold: #b3a369;
      --gt-gold-soft: #fdfaf2;
      --text: #333;
      --muted: #777;
    }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        padding: 16px;
        color: var(--text);
        line-height: 1.4;
        min-width: 280px;
      }


      h1 {
        font-size: 14px;
        margin: 0 0 4px;
        color: var(--text);
      }

      .subtitle {
        font-size: 12px;
        color: var(--muted);
        margin: 0 0 16px;
      }

      fieldset {
        border: none;
        margin: 0;
        padding: 0;
      }

      legend {
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 8px;
        padding: 0;
      }

      label {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 10px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
      }

      label:hover {
        background-color: var(--gt-gold-soft);
      }

      label.disabled {
        cursor: not-allowed;
        color: var(--muted);
      }

      label.disabled:hover {
        background-color: transparent;
      }

      input[type="radio"] {
        accent-color: var(--gt-gold);
        width: 14px;
        height: 14px;
      }

      .option-label {
        flex: 1;
      }

      .option-hint {
        font-size: 11px;
        color: var(--muted);
      }

      .status {
        margin-top: 12px;
        font-size: 12px;
        color: var(--muted);
        min-height: 1.2em;
      }

      .footer {
        margin-top: 16px;
        padding-top: 12px;
        border-top: 1px solid #eee;
        font-size: 11px;
        color: var(--muted);
      }

      .footer a {
        color: var(--gt-gold);
        text-decoration: none;
      }

      .footer a:hover {
        text-decoration: underline;
      }
  </style>
</head>
<body>
  <main>
    <h1>Georgia Tech OMSCS Radar</h1>
    <p class="subtitle">Settings</p>

    <fieldset>
      <legend>Preferred data source</legend>

      <label>
        <input type="radio" name="source" value="omscentral">
        <span class="option-label">OMSCentral</span>
      </label>

      <label class="disabled">
        <input type="radio" name="source" value="omshub" disabled>
        <span class="option-label">OMSHub</span>
        <span class="option-hint">coming soon</span>
      </label>
    </fieldset>

    <p class="status" id="status">&nbsp;</p>
  </main>

  <script type="module" src="./popup.ts"></script>
</body>
</html>
