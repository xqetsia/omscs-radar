[project]
name = "omscs-radar-backend"
version = "0.1.0"
description = "FastAPI backend that serves course ratings for the omscs-radar Chrome extension."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "structlog>=24.1",
    "omscs-ratings-scraper",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backend"]

[tool.uv.sources]
omscs-ratings-scraper = { path = "../scraper", editable = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
